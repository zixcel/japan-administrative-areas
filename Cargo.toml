[package]
categories = ["data-structures"]
keywords = ["japan", "administrative-data", "data-validation", "rust"]
name = "zixcel-japan-administrative-areas"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "Exact Japanese administrative subdivision codes and display names"
repository = "https://github.com/zixcel/japan-administrative-areas"
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE"]
[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"
pedantic = "warn"
